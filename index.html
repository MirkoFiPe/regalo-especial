<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para alguien especial</title>
    <style>
        body { background-color: black; color: white; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        #terminal { font-size: 1.5rem; white-space: pre-wrap; width: 80%; }
        .cursor { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="terminal">> <span id="text"></span><span class="cursor">_</span></div>

    <script>
        // Puedes cambiar las frases de aquí abajo si quieres algo más personal
        const texto = "Hola...\nHoy es un día especial...\nAsí que te hice este programa...\nCargando sorpresa...";
        let i = 0;
        function typeWriter() {
            if (i < texto.length) {
                document.getElementById("text").innerHTML += texto.charAt(i);
                i++;
                setTimeout(typeWriter, 100);
            } else {
                setTimeout(() => { window.location.href = "pastel.html"; }, 2000);
            }
        }
        typeWriter();
    </script>
</body>
</html>

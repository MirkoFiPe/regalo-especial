<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>¡Feliz Cumpleaños STHAICY!</title>
    <style> 
        body { margin: 0; overflow: hidden; background: #000; } 
        #mensaje {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 24px;
            pointer-events: none;
            text-shadow: 2px 2px 4px #000000;
        }
    </style>
</head>
<body>
    <div id="mensaje">🎂 Para Sthaicy 🎂</div>
    <script type="module">
        import * as THREE from 'https://cdn.skypack.dev/three@0.132.2';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.132.2/examples/jsm/controls/OrbitControls.js';

        // --- Configuración de la Escena ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a); // Fondo gris muy oscuro
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Activar sombras
        document.body.appendChild(renderer.domElement);

        // --- Luces ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- Grupo Principal del Pastel ---
        const cakeGroup = new THREE.Group();
        scene.add(cakeGroup);

        // 1. El Bizcocho (Base Rosa)
        const baseGeometry = new THREE.CylinderGeometry(3, 3, 2.5, 32);
        const baseMaterial = new THREE.MeshStandardMaterial({ color: 0xffadc6 }); // Rosa suave
        const base = new THREE.Mesh(baseGeometry, baseMaterial);
        base.position.y = 1.25;
        base.castShadow = true;
        cakeGroup.add(base);

        // 2. El Glaseado (Drip rojo/rosa fuerte)
        const dripGeometry = new THREE.CylinderGeometry(3.1, 3.1, 0.8, 32);
        const dripMaterial = new THREE.MeshStandardMaterial({ color: 0xe63e62, roughness: 0.2 }); // Rojo fresa brillante
        const drip = new THREE.Mesh(dripGeometry, dripMaterial);
        drip.position.y = 2.3; 
        cakeGroup.add(drip);

        // Gotas del glaseado (para que parezca que chorrea)
        function crearGota(x, z) {
            const dropGeo = new THREE.SphereGeometry(0.4, 16, 16);
            const drop = new THREE.Mesh(dropGeo, dripMaterial);
            drop.position.set(x, 1.8, z);
            cakeGroup.add(drop);
        }
        crearGota(3, 0); crearGota(-3, 0); crearGota(0, 3); crearGota(0, -3);
        crearGota(2.1, 2.1); crearGota(-2.1, 2.1);

        // 3. Crema batida en la base (Bolitas blancas abajo)
        const creamGeo = new THREE.SphereGeometry(0.4, 16, 16);
        const creamMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        for(let i=0; i<12; i++) {
            const cream = new THREE.Mesh(creamGeo, creamMat);
            const angle = (i / 12) * Math.PI * 2;
            cream.position.x = Math.cos(angle) * 3.2;
            cream.position.z = Math.sin(angle) * 3.2;
            cream.position.y = 0.2;
            cakeGroup.add(cream);
        }

        // 4. Fresas arriba 🍓
        const strawberryGeo = new THREE.ConeGeometry(0.35, 0.7, 16);
        const strawberryMat = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        
        // Hojas de la fresa
        const leafGeo = new THREE.CylinderGeometry(0, 0.25, 0.1, 5);
        const leafMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });

        function ponerFresa(x, z) {
            const group = new THREE.Group();
            const berry = new THREE.Mesh(strawberryGeo, strawberryMat);
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.position.y = 0.3;
            group.add(berry);
            group.add(leaf);
            group.position.set(x, 2.9, z);
            cakeGroup.add(group);
        }
        ponerFresa(1, 1);
        ponerFresa(-1, 0.5);
        ponerFresa(0, -1);

        // 5. Palitos (Pocky) 🥢
        const stickGeo = new THREE.CylinderGeometry(0.08, 0.08, 2.5, 16);
        const stickMat = new THREE.MeshStandardMaterial({ color: 0xd2691e }); // Color galleta
        
        const stick1 = new THREE.Mesh(stickGeo, stickMat);
        stick1.position.set(0.5, 3.5, -0.5);
        stick1.rotation.z = -0.2;
        cakeGroup.add(stick1);

        const stick2 = new THREE.Mesh(stickGeo, stickMat);
        stick2.position.set(0.8, 3.4, -0.2);
        stick2.rotation.z = 0.1;
        stick2.rotation.x = 0.1;
        cakeGroup.add(stick2);

        // --- Cámara y Animación ---
        camera.position.set(0, 4, 8);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        function animate() {
            requestAnimationFrame(animate);
            cakeGroup.rotation.y += 0.005; // Girar suavemente
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Ajustar al cambiar tamaño de ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
